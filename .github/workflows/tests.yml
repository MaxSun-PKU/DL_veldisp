name: tests

on:
  push:
  pull_request:

jobs:
  reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pandas matplotlib h5py astropy requests tqdm Pillow
      - name: Compile Python sources
        run: python -m compileall -q data_loader_v2.py physmodel.py scripts tests
      - name: Test the bundled reference model
        run: python -m unittest discover -s tests -v
